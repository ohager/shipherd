<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>shipherd</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>⛵ shipherd</h1>
    <span id="summary"></span>
    <span id="conn"></span>
    <span id="notice"></span>
    <div id="grouping" role="group" aria-label="Group the board by">
      <button data-grouping="status">Status</button><button data-grouping="workspace">Workspace</button>
    </div>
    <button id="open-tty7" title="Bring the tty7 window to the front">Open tty7</button>
  </header>
  <div id="banners"></div>

  <div id="board-view">
    <main id="board">
      <section class="column" data-status="waiting"><h2>Needs you</h2><div class="cards"></div></section>
      <section class="column" data-status="working"><h2>Working</h2><div class="cards"></div></section>
      <section class="column" data-status="done"><h2>Done</h2><div class="cards"></div></section>
    </main>
    <main id="ws-board" hidden></main>
    <details id="idle"><summary>Idle <span class="count"></span></summary><div class="cards"></div></details>
  </div>

  <div id="focus" hidden>
    <nav id="f-list" aria-label="Agents">
      <button id="f-back" class="link">← Board</button>
      <div id="f-groups"></div>
      <p class="hint">↑↓ / j k switch · Esc back</p>
    </nav>
    <section id="detail">
      <div id="d-crumb"></div>
      <div class="d-head">
        <h2 id="d-title"></h2>
        <span id="d-pill" class="pill"></span>
      </div>
      <div id="d-meta"></div>
      <dl id="d-facts"></dl>
      <div id="d-procs"></div>
      <div id="d-interact-label" hidden>INTERACTING: your keys go to this agent</div>
      <pre id="d-mirror"></pre>
      <div class="d-actions">
        <button id="d-approve" hidden>Approve</button>
        <button id="d-deny" hidden>Deny</button>
        <form id="d-reply" hidden><input id="d-reply-text" placeholder="Reply…" autocomplete="off"><button>Send</button></form>
        <label class="toggle"><input type="checkbox" id="d-interact"> Interact</label>
        <button id="d-close-pane" class="danger-outline">Close pane…</button>
      </div>
      <div id="d-confirm" hidden>
        <span id="d-confirm-text"></span>
        <button id="d-confirm-yes" class="danger">Close</button>
        <button id="d-confirm-no">Cancel</button>
      </div>
      <p id="d-result"></p>
    </section>
  </div>

  <script src="/logic.js"></script>
  <script src="/app.js"></script>
</body>
</html>
